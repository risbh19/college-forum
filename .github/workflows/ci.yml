name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install locked backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend security and API tests
        working-directory: backend
        run: python -m pytest -q
      - name: Audit production frontend dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and privacy tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Build production FastAPI container
        run: docker build --tag college-forum-api:ci ./backend
