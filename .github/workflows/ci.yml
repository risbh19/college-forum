name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/college_forum_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/college_forum_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate database schema
        run: npx prisma validate
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and privacy tests
        run: npm test
      - name: Production build
        run: npm run build
